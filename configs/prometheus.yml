# configs/prometheus.yml
# All SDN metrics are exposed by the dashboard at /metrics.
# Run Prometheus with: prometheus --config.file=configs/prometheus.yml

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sdn_dashboard
    static_configs:
      - targets: ["localhost:5000"]
    metrics_path: /metrics

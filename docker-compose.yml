version: "3.8"

# Note: network_mode: host is required for controllers so that Mininet
# (running on the host) can reach the OpenFlow ports. This only works on Linux.

services:
  ctrl_01:
    build: .
    container_name: sdn_ctrl_01
    network_mode: host
    environment:
      - CONTROLLER_ID=ctrl_01
    volumes:
      - ./keys:/app/keys
      - ./logs:/app/logs
      - sdn_tmp:/tmp
    command: ryu-manager --ofp-tcp-listen-port 6633 controller/ryu_controller.py

  ctrl_02:
    build: .
    container_name: sdn_ctrl_02
    network_mode: host
    environment:
      - CONTROLLER_ID=ctrl_02
    volumes:
      - ./keys:/app/keys
      - ./logs:/app/logs
      - sdn_tmp:/tmp
    command: ryu-manager --ofp-tcp-listen-port 6634 controller/ryu_controller.py

  ctrl_03:
    build: .
    container_name: sdn_ctrl_03
    network_mode: host
    environment:
      - CONTROLLER_ID=ctrl_03
    volumes:
      - ./keys:/app/keys
      - ./logs:/app/logs
      - sdn_tmp:/tmp
    command: ryu-manager --ofp-tcp-listen-port 6635 controller/ryu_controller.py

  dashboard:
    build: .
    container_name: sdn_dashboard
    network_mode: host
    volumes:
      - ./keys:/app/keys
      - ./logs:/app/logs
      - sdn_tmp:/tmp
    command: python3 dashboard/app.py
    restart: unless-stopped
    depends_on:
      - ctrl_01
      - ctrl_02
      - ctrl_03

  prometheus:
    image: prom/prometheus:latest
    container_name: sdn_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: sdn_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sdn2026
    depends_on:
      - prometheus

volumes:
  sdn_tmp:
